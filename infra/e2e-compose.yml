services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gather_test
      POSTGRES_USER: gather_test
      POSTGRES_PASSWORD: gather_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gather_test -d gather_test"]
      interval: 2s
      timeout: 3s
      retries: 30
